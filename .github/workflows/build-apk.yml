name: build-apk

# Создано «Игротекой». Собирает APK игры (C++ и SDL2) и публикует его в Releases.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: com.kokoko.shahmaty
  APP_LABEL: Шахматы
  APK_NAME: Game.apk
  JNI_NAME: game

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: SDL2
          path: SDL

      - uses: actions/checkout@v4
        with:
          path: game
          fetch-depth: 0

      - name: Prepare SDL android project
        run: |
          cd SDL/android-project
          ln -sfn ../../../ app/jni/SDL
          ls -la app/jni/SDL
          # берём тот файл .cpp, который загружали последним (по времени коммита), номер в имени не важен
          BEST=0; SRC=""
          for f in ../../game/*.cpp; do
            T=$(git -C ../../game log -1 --format=%ct -- "$(basename "$f")")
            if [ "${T:-0}" -ge "$BEST" ]; then BEST=${T:-0}; SRC="$f"; fi
          done
          echo "Файл игры: $SRC"
          cp "$SRC" app/jni/src/$JNI_NAME.cpp
          # заголовки SDL лежат в SDL/include/SDL.h, а игра подключает <SDL2/SDL.h>: приводим к одному виду
          sed -i 's#<SDL2/#<#g' app/jni/src/$JNI_NAME.cpp
          sed -i "s/LOCAL_SRC_FILES := YourSourceHere.c/LOCAL_SRC_FILES := $JNI_NAME.cpp/" app/jni/src/Android.mk
          sed -i '/LOCAL_SRC_FILES/a LOCAL_CPPFLAGS := -std=c++14 -Wno-narrowing -fexceptions -O3' app/jni/src/Android.mk
          # игре нужны исключения C++ (try/catch), в NDK они по умолчанию выключены
          sed -i '/LOCAL_CPPFLAGS/a LOCAL_CPP_FEATURES := exceptions rtti' app/jni/src/Android.mk
          # APP_OPTIM release: без него NDK в debug-сборке собирает код БЕЗ оптимизаций (-O0), и игра идёт в разы медленнее
          printf 'APP_STL := c++_shared\nAPP_PLATFORM := android-21\nAPP_OPTIM := release\nAPP_ABI := arm64-v8a armeabi-v7a\n' > app/jni/Application.mk
          MANIFEST=app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n\n    <application#' "$MANIFEST"
          sed -i 's#<activity #<activity android:screenOrientation="portrait" #' "$MANIFEST"
          # своё имя и свой идентификатор приложения, чтобы игры не затирали друг друга на телефоне
          sed -i -E "s#applicationId ['\"]org\.libsdl\.app['\"]#applicationId \"$APP_ID\"#" app/build.gradle
          # в шаблоне SDL нет applicationId (он берётся из namespace org.libsdl.app, и все игры получались одним приложением): задаём свой
          grep -q applicationId app/build.gradle || sed -i "0,/defaultConfig {/s//defaultConfig {\n        applicationId \"$APP_ID\"/" app/build.gradle
          sed -i -E "s#(<string name=\"app_name\">)[^<]*(</string>)#\1$APP_LABEL\2#" app/src/main/res/values/strings.xml
          # рисовать на весь экран, в том числе под вырезом камеры (иначе справа остаётся чёрная полоса)
          ACT=app/src/main/java/org/libsdl/app/SDLActivity.java
          [ -f "$ACT" ] && sed -i '0,/super.onCreate(savedInstanceState);/s//super.onCreate(savedInstanceState);\n        if (android.os.Build.VERSION.SDK_INT >= 28) { getWindow().getAttributes().layoutInDisplayCutoutMode = 1; }/' "$ACT"
          grep -n "layoutInDisplayCutoutMode" "$ACT" || echo "cutout patch NOT applied"
          # тема с «заходом» под вырез камеры (в ландшафте иначе справа остаётся чёрная полоса)
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/cutout.xml <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="GameTheme" parent="@android:style/Theme.NoTitleBar.Fullscreen">
              <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
            </style>
          </resources>
          XEOF
          sed -i -E 's#android:theme="[^"]*"#android:theme="@style/GameTheme"#' "$MANIFEST"
          grep -n "android:theme" "$MANIFEST" || echo "ТЕМА НЕ НАЙДЕНА В МАНИФЕСТЕ"
          echo "----- Android.mk -----"; cat app/jni/src/Android.mk
          echo "----- Application.mk -----"; cat app/jni/Application.mk
          echo "----- applicationId -----"; grep -n applicationId app/build.gradle || true

